<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Min karta över Lund</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      color-scheme: light;
      --ink: #183b37;
      --muted: #637570;
      --paper: #f5f7f3;
      --line: #dce5df;
      --accent: #d85f43;
      --green: #286b5b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 88px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: var(--green);
      font-size: 21px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 600;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .map-label {
      color: var(--muted);
      font-size: 13px;
    }

    main {
      display: grid;
      flex: 1;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      min-height: 0;
    }

    aside {
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 24px 20px;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: #fff;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 600;
    }

    #place-count {
      color: var(--muted);
      font-size: 12px;
    }

    #search {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--paper);
      font: inherit;
      font-size: 14px;
    }

    #category-filter {
      width: 100%;
      min-height: 42px;
      margin-top: 8px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #search:focus-visible,
    #category-filter:focus-visible,
    .place-button:focus-visible,
    #reset-map:focus-visible {
      outline: 3px solid #e8a18f;
      outline-offset: 2px;
    }

    #place-list {
      display: grid;
      flex: 1;
      min-height: 0;
      gap: 8px;
      margin-top: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      align-content: start;
      padding-right: 4px;
    }

    .place-button {
      display: block;
      width: 100%;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .place-button:hover,
    .place-button[aria-current="true"] {
      border-color: var(--green);
      background: #eff6f1;
    }

    .place-button strong,
    .place-button span {
      display: block;
    }

    .place-button strong {
      font-size: 14px;
    }

    .place-button .place-category {
      width: fit-content;
      margin-top: 7px;
      padding: 3px 7px;
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      line-height: 1.3;
    }

    .place-button span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .map-pin {
      position: relative;
      display: block;
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 1px 4px #183b3766;
      transform: rotate(-45deg);
    }

    .map-pin::after {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    #empty-state {
      margin: 8px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .map-area {
      position: relative;
      min-height: 0;
      padding: 16px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #e5ece6;
    }

    #reset-map {
      position: absolute;
      z-index: 500;
      top: 28px;
      right: 28px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 6px;
    }

    .leaflet-popup-content h3 {
      margin: 2px 0 6px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
    }

    .leaflet-popup-content p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .leaflet-popup-content dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 8px;
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.4;
    }

    .leaflet-popup-content dt {
      font-weight: 700;
    }

    .leaflet-popup-content dd {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      header {
        min-height: 76px;
        padding: 13px 16px;
      }

      h1 {
        font-size: 20px;
      }

      .map-label {
        display: none;
      }

      main {
        grid-template-columns: 1fr;
        flex: initial;
      }

      aside {
        min-height: auto;
        padding: 18px 16px;
        overflow: visible;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      #place-list {
        flex: initial;
        max-height: 35vh;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }

      .map-area {
        min-height: 55vh;
        padding: 12px;
      }

      #map {
        height: 55vh;
        min-height: 360px;
      }

      #reset-map {
        top: 22px;
        right: 22px;
      }

      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
    }
  </style>
</head>

            label: field[0],
            value: typeof value === "string" ? value.trim() : ""
          };
        })
        .filter(function(detail) {
          return detail.value !== "";
        });
    }

    function selectPlace(plats) {
      map.setView(plats.koordinater, 16);
      markers.get(plats.namn).openPopup();
      document.querySelectorAll(".place-button").forEach(function(button) {
        button.setAttribute("aria-current", String(button.dataset.name === plats.namn));
      });
    }

    function renderPlaces(query) {
      const normalizedQuery = query.trim().toLocaleLowerCase("sv");
      const selectedCategory = categoryFilter.value;
      const matches = platser
        .filter(function(plats) {
          const searchableText = [
            plats.namn,
            plats.beskrivning,
            plats.kategori,
            ...getPlaceDetails(plats).map(function(detail) {
              return detail.value;
            })
          ].join(" ").toLocaleLowerCase("sv");
          return searchableText.includes(normalizedQuery)
            && (!selectedCategory || plats.kategori === selectedCategory);
        })
        .sort(function(a, b) {
          return a.namn.localeCompare(b.namn, "sv");
        });

      placeList.replaceChildren();
      placeCount.textContent = matches.length + (matches.length === 1 ? " plats" : " platser");

      markers.forEach(function(marker, name) {
        const plats = platser.find(function(place) {
          return place.namn === name;
        });
        const isVisible = matches.includes(plats);
        if (isVisible && !map.hasLayer(marker)) {
          marker.addTo(map);
        } else if (!isVisible && map.hasLayer(marker)) {
          map.removeLayer(marker);
        }
      });

      if (matches.length === 0) {
        const emptyState = document.createElement("p");
        emptyState.id = "empty-state";
        emptyState.textContent = "Inga platser matchar dina filter.";
        placeList.appendChild(emptyState);
      }

      matches.forEach(function(plats) {
        const button = document.createElement("button");
        button.className = "place-button";
        button.type = "button";
        button.dataset.name = plats.namn;

        const name = document.createElement("strong");
        name.textContent = plats.namn;
        button.appendChild(name);
        const category = document.createElement("span");
        category.className = "place-category";
        category.textContent = plats.kategori;
        category.style.backgroundColor = categoryColors[plats.kategori];
        button.appendChild(category);
        if (plats.beskrivning.trim() !== "") {
          const description = document.createElement("span");
          description.textContent = plats.beskrivning.trim();
          button.appendChild(description);
        }
        getPlaceDetails(plats).forEach(function(detail) {
          const detailText = document.createElement("span");
          detailText.textContent = detail.label + ": " + detail.value;
          button.appendChild(detailText);
        });
        button.addEventListener("click", function() {
          selectPlace(plats);
        });
        placeList.appendChild(button);
      });
    }

    platser.forEach(function(plats) {
      const popup = document.createElement("div");
      const title = document.createElement("h3");
      title.textContent = plats.namn;
      popup.appendChild(title);
      if (plats.beskrivning.trim() !== "") {
        const description = document.createElement("p");
        description.textContent = plats.beskrivning.trim();
        popup.appendChild(description);
      }
      const details = getPlaceDetails(plats);
      if (details.length > 0) {
        const detailList = document.createElement("dl");
        details.forEach(function(detail) {
          const label = document.createElement("dt");
          label.textContent = detail.label;
          const value = document.createElement("dd");
          value.textContent = detail.value;
          detailList.append(label, value);
        });
        popup.appendChild(detailList);
      }

      const markerIcon = L.divIcon({
        className: "",
        html: '<span class="map-pin" style="background-color: ' + categoryColors[plats.kategori] + '"></span>',
        iconSize: [24, 24],
        iconAnchor: [12, 24],
        popupAnchor: [0, -24]
      });
      const marker = L.marker(plats.koordinater, { icon: markerIcon })
        .addTo(map)
        .bindPopup(popup);
      marker.on("click", function() {
        document.querySelectorAll(".place-button").forEach(function(button) {
          button.setAttribute("aria-current", String(button.dataset.name === plats.namn));
        });
      });
      markers.set(plats.namn, marker);
    });

    search.addEventListener("input", function() {
      renderPlaces(search.value);
    });
    categoryFilter.addEventListener("change", function() {
      renderPlaces(search.value);
    });
    Array.from(new Set(platser.map(function(plats) {
      return plats.kategori;
    }))).forEach(function(category) {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      categoryFilter.appendChild(option);
    });
    document.getElementById("reset-map").addEventListener("click", function() {
      map.setView(initialCenter, initialZoom);
      map.closePopup();
      document.querySelectorAll(".place-button").forEach(function(button) {
        button.setAttribute("aria-current", "false");
      });
    });

    renderPlaces("");


  </script>

</body>
</html>
